name: Refresh data

# How this runs
# -------------
# GitHub's cron is unreliable (it fired every 4 to 6 hours for this repo instead of every 30 minutes),
# so the real cadence comes from a LOOP job: one run refreshes, commits, sleeps, and repeats for up to
# ~5.5 hours, then dispatches a fresh copy of itself. When new code lands on main the loop ends its cycle
# and hands over, so the next loop runs the new code. The cron entries are only a watchdog that dispatches
# a loop if none is alive. Nothing is ever cancelled, so the owner gets no failure or cancellation emails.
#
# Cycle length: 10 minutes normally, 3 minutes during election week. Data is committed to the `data` branch
# (not main), so GitHub Pages never has to rebuild for a data refresh; the page reads the branch through the
# raw CDN. On election night the page itself also polls the results feeds directly every 30 seconds.

# ARCHIVED after the 2026 midterms: no schedule, no push trigger. Re-enable the workflow in the Actions tab and
# restore the schedule block below to bring it back for the next cycle.
#  schedule:
#    - cron: "11,41 * * * *"
on:
  workflow_dispatch:
    inputs:
      once:
        description: "Run a single refresh cycle instead of the loop"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Loops hold the lock; a push (validation only, no commit) uses its own group so it never waits 5 hours.
    # Nothing is ever cancelled (cancellations email the repo owner). The loop notices new code itself and
    # hands over; the watchdog only dispatches a loop when none is alive.
    concurrency:
      group: refresh-${{ github.event_name == 'push' && 'validate' || github.event_name == 'schedule' && 'watchdog' || 'loop' }}
      cancel-in-progress: false
    timeout-minutes: 355
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LIVE_FROM: "2026-11-03 10:00"
      LIVE_UNTIL: "2026-11-07 00:00"
      LOOP_MAX_SECONDS: "19800"      # 5.5 hours, then hand over to a fresh run
    steps:
      - name: Watchdog (scheduled runs only)
        id: watchdog
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh.yml --json status,event \
            --jq '[.[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting") and .event=="workflow_dispatch")] | length')
          echo "active loops: ${active:-?}"
          if [ "${active:-0}" -ge 1 ]; then
            echo "loop alive, nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "no loop alive: dispatched one"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.watchdog.outputs.skip != '1'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.watchdog.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Check out the data branch
        if: steps.watchdog.outputs.skip != '1'
        run: |
          git config user.name "midterms-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch -q --depth 1 origin data
            git worktree add -q _data origin/data
            git -C _data checkout -q -B data
          else
            git worktree add -q --detach _data
            git -C _data checkout -q --orphan data
            git -C _data rm -rq . || true
            mkdir -p _data/data && cp -r data/. _data/data/
            git -C _data add -A && git -C _data commit -qm "data branch: initial snapshot"
            git -C _data push -q origin data
          fi
          # Seeds and the sample feed live on main; mirror them so the page can read everything from one place.
          mkdir -p _data/data/seed && cp -r data/seed/. _data/data/seed/
          echo "data branch ready: $(git -C _data rev-parse --short HEAD)"

      - name: Refresh loop
        if: steps.watchdog.outputs.skip != '1'
        env:
          DATA_DIR: ${{ github.workspace }}/_data/data
          SEED_DIR: ${{ github.workspace }}/data/seed
        run: |
          set -u
          start=$(date -u +%s)
          live_from=$(date -u -d "$LIVE_FROM" +%s)
          live_until=$(date -u -d "$LIVE_UNTIL" +%s)
          once=0
          commit=1
          if [ "${{ github.event_name }}" = "push" ]; then once=1; commit=0; fi
          if [ "${{ github.event.inputs.once || '0' }}" = "1" ]; then once=1; fi
          polls_last=0
          if [ -f "$DATA_DIR/polls.json" ]; then
            polls_last=$(python3 -c "import json,datetime,os;d=json.load(open(os.environ['DATA_DIR']+'/polls.json'));print(int(datetime.datetime.fromisoformat(d['generated_at']).timestamp()))" 2>/dev/null || echo 0)
          fi
          cycle=0
          while true; do
            cycle=$((cycle+1))
            now=$(date -u +%s)
            if [ "$now" -ge "$live_from" ] && [ "$now" -lt "$live_until" ]; then
              period=180; live=1
            else
              period=600; live=0
            fi
            # Polls from Wikipedia: hourly at most (rate limited), never on election night after polls close.
            fast=0
            if [ "$live" = "1" ]; then fast=1; fi
            if [ $((now - polls_last)) -ge 3600 ] && [ "$live" = "0" -o $((now - live_from)) -lt 36000 ]; then
              echo "::group::polls (cycle $cycle)"
              POLLS_TIME_BUDGET=240 POLLS_ROTATE=1 timeout 330 python scripts/polls.py || echo "poll collection failed; keeping previous data"
              echo "::endgroup::"
              polls_last=$(date -u +%s)
              fast=0
            fi
            # Full (slow) refresh at least every 30 minutes even on election night, fast otherwise.
            if [ "$live" = "1" ] && [ $(( (now / 60) % 30 )) -lt 7 ]; then fast=0; fi
            echo "::group::refresh (cycle $cycle, live=$live fast=$fast period=${period}s)"
            FAST_MODE=$fast timeout 600 python scripts/refresh.py || echo "refresh failed; will retry next cycle"
            echo "::endgroup::"
            if [ "$commit" = "1" ]; then
              git -C _data add -A
              if git -C _data diff --cached --quiet; then
                echo "no data changes"
              else
                git -C _data commit -qm "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
                pushed=0
                for i in 1 2 3 4; do
                  if git -C _data push -q origin data; then pushed=1; break; fi
                  echo "push rejected (attempt $i); taking ours over the remote"
                  git -C _data fetch -q origin data
                  git -C _data reset -q --soft origin/data
                  git -C _data commit -qm "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || true
                  sleep 5
                done
                [ "$pushed" = "1" ] || echo "::warning::could not push this cycle"
                # Keep the data branch from growing without bound: squash its history once a day.
                if [ "$(date -u +%H%M)" \< "0015" ] || [ "$(git -C _data rev-list --count HEAD)" -gt 2000 ]; then
                  git -C _data checkout -q --orphan data-squash && git -C _data commit -qm "data: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')" && git -C _data branch -q -M data && git -C _data push -q --force origin data || true
                fi
              fi
            fi
            elapsed=$(( $(date -u +%s) - start ))
            if [ "$once" = "1" ]; then echo "single cycle done"; break; fi
            git fetch -q origin main || true
            if ! git diff --quiet HEAD origin/main -- scripts .github data/seed 2>/dev/null; then
              echo "new code on main; handing over to a fresh loop"; break
            fi
            if [ $elapsed -ge $LOOP_MAX_SECONDS ]; then echo "loop budget reached after $cycle cycles"; break; fi
            took=$(( $(date -u +%s) - now ))
            wait=$(( period - took ))
            [ $wait -lt 15 ] && wait=15
            echo "cycle $cycle took ${took}s; sleeping ${wait}s"
            sleep $wait
          done

      - name: Hand over to a fresh loop (or start one after a push)
        if: (success() || failure()) && github.event_name != 'schedule' && (github.event.inputs.once || '0') != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only start the next loop if nothing is already queued or running for it.
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh.yml --json databaseId,status,event \
            --jq '[.[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting") and .event!="push")] | length')
          me=1; [ "${{ github.event_name }}" = "push" ] && me=0
          echo "active loop runs (excluding this one): $((active - me))"
          if [ $((active - me)) -le 0 ]; then
            gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "dispatched next loop"
          else
            echo "another loop is already queued; not dispatching"
          fi
